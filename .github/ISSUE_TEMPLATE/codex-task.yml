name: Codex queue task
description: Submit one bounded task for the local Codex queue worker.
title: "[Codex] "
labels:
  - "agent:queued"
body:
  - type: markdown
    attributes:
      value: |
        This form is data, not executable instructions. The local worker accepts only these fields,
        validates paths and the fixed test profile, and never executes shell text from an issue.
        Use this one form for all managed work; the `agent:*` lifecycle label is the authoritative status.
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      description: Select the bounded kind of work.
      options:
        - bug
        - feature
        - research
        - maintenance
        - refactor
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 is urgent; P3 is routine. Priority does not bypass safety gates.
      options:
        - P0
        - P1
        - P2
        - P3
      default: 2
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk tier
      description: Choose the highest applicable tier. High and critical work stays in Draft until explicit human approval.
      options:
        - low
        - medium
        - high
        - critical
      default: 1
    validations:
      required: true
  - type: dropdown
    id: owner_worker_role
    attributes:
      label: Owner / worker role
      description: The user owns scope and merge decisions; the local worker only implements bounded tasks.
      options:
        - "Owner: human; worker: local Codex queue"
    validations:
      required: true
  - type: input
    id: task_title
    attributes:
      label: Title
      description: Short, implementation-focused task title.
      placeholder: Add validation for portfolio import
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the intended outcome and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: One verifiable criterion per line.
      placeholder: |
        New invalid input is rejected.
        Existing valid imports still succeed.
    validations:
      required: true
  - type: textarea
    id: next_action
    attributes:
      label: Next action
      description: The next action a human or worker should take. Keep it short and decision-oriented.
      placeholder: Review the scope and queue this task.
      value: Review the scope and queue this task.
    validations:
      required: true
  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      description: One repository-relative file or directory per line. A trailing slash permits that directory subtree.
      placeholder: |
        scripts/
        docs/
      value: |
        scripts/
        docs/
    validations:
      required: true
  - type: textarea
    id: forbidden_paths
    attributes:
      label: Forbidden paths
      description: One repository-relative file or directory per line. These are enforced in addition to the worker's built-in protected paths.
      value: |
        final.py
        signals.py
        regime_playbook.py
        hedging.py
        fix_ai.py
        fix_fallback.py
        fix_final4.py
        fix_signals4.py
    validations:
      required: true
  - type: dropdown
    id: test_profile
    attributes:
      label: Test command
      description: The worker maps this selection to a fixed command. Free-form shell commands are never executed.
      options:
        - python-compile-and-pytest
        - pytest
        - automation-smoke
    validations:
      required: true
