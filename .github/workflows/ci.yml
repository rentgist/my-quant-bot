name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Check Python syntax
        run: >-
          python -m py_compile
          final.py config.py data_loader.py defensive_overlay.py hedging.py
          indicators.py portfolio_manager.py regime_playbook.py signals.py
          calendar_manager.py ai_reporter.py alert_bot.py tests/*.py
      - name: Run current tests
        run: python -m pytest
