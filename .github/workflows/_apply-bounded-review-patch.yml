name: Apply bounded review patch

on:
  push:
    branches:
      - fix/bounded-review-loop-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bounded-review-loop-v2
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/_apply_bounded_review_patch.py
      - name: Commit worker patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/codex-queue-worker.ps1
          git commit -m "feat(automation): wire bounded Claude review loop"
          git push origin HEAD:fix/bounded-review-loop-v2
